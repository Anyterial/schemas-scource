description: |-
  Unicode rendering of the Hall symbol for the setting.

  This field is a compact Unicode approximation intended for plain-text display. It uses Unicode combining overlines and available subscript/superscript characters where possible.

  **Requirements/Conventions**:

  - The value is a rendering aid and is not intended as a machine-parsed canonical symbol.
  - The ASCII `hall` field remains the preferred interchange representation.
