$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/v0.1/properties/spacegroups/harker_planes
title: Harker Planes
$comment: Generated from data-generators JSON-LD fields without external definition URLs.
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: harker_planes
  label: harker_planes_spacegroups
type:
- array
- 'null'
description: Harker planes of the space group in fractional Patterson coordinates, as generated by cctbx. Each entry contains an algebraic plane expression, a normal vector, and a point on the plane.
x-optimade-unit: inapplicable
items:
  x-optimade-type: dictionary
  type:
  - object
  - 'null'
  description: One Harker plane or special-position condition.
  properties:
    point: &id001
      x-optimade-type: list
      type:
      - array
      - 'null'
      description: Three fractional-coordinate components written as exact rational/algebraic strings.
      items:
        $$inherit: "/properties/core/fraction"
        $$keep:
        - x-optimade-type
        - x-optimade-unit
        - type
        description: One exact coordinate component.
      x-optimade-unit: inapplicable
    normal: *id001
    const:
      $$inherit: "/properties/core/fraction"
      $$keep:
      - x-optimade-type
      - x-optimade-unit
      - type
      description: Plane constant represented exactly.
    xyz:
      x-optimade-type: string
      type:
      - string
      - 'null'
      description: Plane equation in x,y,z notation.
      x-optimade-unit: inapplicable
  x-optimade-unit: inapplicable
examples:
- - algebraic: 2*x,0,2*z
    normal:
    - 0
    - 1
    point:
    - 0.0
    - 0.0
- - algebraic: 2*x,2*y,0
    normal:
    - 0
    - 0
    point:
    - 0.0
    - 0.0
