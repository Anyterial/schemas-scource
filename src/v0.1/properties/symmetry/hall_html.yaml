  name: hall_html
  label: hall_html_symmetry
type:
- string
- 'null'
description: |-
  HTML rendering of the Hall symbol for the setting.

  This field contains a small HTML fragment using inline elements such as `span`, `sub`, and `sup` to represent overlines and aligned subscript/superscript notation.

  **Requirements/Conventions**:

  - The fragment is intended for insertion into an HTML context.
  - The mathematical content MUST match the ASCII Hall symbol in `hall`.
x-optimade-unit: inapplicable
examples:
- P 1
- '<span style="text-decoration: overline;">P</span> 1'
