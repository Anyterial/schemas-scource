$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/properties/pointgroups/pointgroups
title: Point groups
$comment: Anyterial top-level ordered point-group table.
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: pointgroups
  label: pointgroups_pointgroups
x-optimade-unit: inapplicable
type:
- array
- 'null'
description: |-
  Ordered table of crystallographic point-group records.
  Each item contains point-group classification, finite point-group operations, conjugacy classes, and real and complex character tables generated from cctbx and spgrep.

  **Requirements/Conventions**:

  - The table covers the 32 crystallographic point groups.
  - The point-group records are independent of any particular space-group setting.
  - Character-table rows use Mulliken labels and include formatted label variants when available.
items:
  x-optimade-type: dictionary
  x-optimade-unit: inapplicable
  type:
  - object
  - 'null'
  description: One crystallographic point-group record.
  properties:
    hm_symbol:
      $$inherit: "/defs/v0.1/properties/pointgroups/hm_symbol"
    schoenflies:
      $$inherit: "/defs/v0.1/properties/pointgroups/schoenflies"
    schoenflies_markup:
      $$inherit: "/defs/v0.1/properties/pointgroups/schoenflies_markup"
    crystal_system:
      $$inherit: "/defs/v0.1/properties/pointgroups/crystal_system"
    laue_class:
      $$inherit: "/defs/v0.1/properties/pointgroups/laue_class"
    order:
      $$inherit: "/defs/v0.1/properties/pointgroups/order"
    is_centrosymmetric:
      $$inherit: "/defs/v0.1/properties/pointgroups/is_centrosymmetric"
    n_conjugacy_classes:
      $$inherit: "/defs/v0.1/properties/pointgroups/n_conjugacy_classes"
    symops:
      $$inherit: "/defs/v0.1/properties/pointgroups/symops"
    conjugacy_classes:
      $$inherit: "/defs/v0.1/properties/pointgroups/conjugacy_classes"
    character_table_complex:
      $$inherit: "/defs/v0.1/properties/pointgroups/character_table_complex"
    character_table_real:
      $$inherit: "/defs/v0.1/properties/pointgroups/character_table_real"

examples:
- - hm_symbol: 2/m
    order: 4
