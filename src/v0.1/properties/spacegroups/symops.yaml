$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/v0.1/properties/spacegroups/symops
title: Symops
$comment: Generated from data-generators JSON-LD fields without external definition URLs.
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: symops
  label: symops_spacegroups
x-optimade-unit: inapplicable  
type:
- array
- 'null'
description: |-

  Full list of symmetry operations for the spacegroup.

  **Requirements/Conventions**:

  - Each list member MUST be a dictionary with the following keys:

    - **rot_type**: REQUIRED. String. The crystallographic rotation type or operation type label.
    - **sense**: REQUIRED. Integer. Rotation sense/sign convention used by the generator.
    - **axis**: REQUIRED; List of integers. Three integer components defining the transformation axis.
    - **screw_glide**: OPTIONAL; List of 3 Fractions (String). Screw-axis or glide-plane component as Fractions, if present.
    - **origin_shift**: REQUIRED; List of 3 Fractions (String). Origin shift associated with the operation as Fractions.
items:
  x-optimade-type: dictionary
  x-optimade-unit: inapplicable
  type:
  - object
  - 'null'
  description: One symmetry operation or operation-class representative.
  properties:
    rot_type:
      x-optimade-type: string
      x-optimade-unit: inapplicable
      type:
      - string
      - 'null'
      description: Crystallographic rotation type or operation type label.
    sense:
      x-optimade-type: integer
      x-optimade-unit: inapplicable
      type:
      - integer
      - 'null'
      description: Rotation sense/sign convention used by the generator.
    axis:
      x-optimade-type: list
      x-optimade-unit: inapplicable
      type:
      - array
      - 'null'
      description: Three integer components.
      items:
        x-optimade-type: integer
        type:
        - integer
        - 'null'
        description: One integer component.
        x-optimade-unit: inapplicable
    screw_glide:
      x-optimade-type: list
      x-optimade-unit: inapplicable
      x-optimade-dimensions:
        names: ["dim_lattice"]
        sizes: [3]
      type:
      - array
      - 'null'
      description: Optional screw-axis or glide-plane component for a space-group affine operation, represented exactly as a list of fraction strings.
      items:
        $$inherit: "/properties/core/fraction"
        $$keep:
        - x-optimade-type
        - x-optimade-unit
        - type
        description: One exact fractional component.
    origin_shift:
      x-optimade-type: list
      x-optimade-unit: inapplicable
      x-optimade-dimensions:
        names: ["dim_lattice"]
        sizes: [3]
      type:
      - array
      - 'null'
      description: Optional origin-shift descriptor associated with the screw/glide decomposition of a space-group affine operation, represented exactly as a list of fraction strings.
      items:
        $$inherit: "/properties/core/fraction"
        $$keep:
        - x-optimade-type
        - x-optimade-unit
        - type
        description: One exact fractional component.
examples:
- - rot_type: '1'
    sense: 0
    axis:
    - 0
    - 0
    screw_glide: [ "0", "0", "0" ]
    origin_shift: [ "0", "0", "0" ]
- - rot_type: '-1'
    sense: 0
    axis:
    - 0
    - 0
    screw_glide: [ "0", "0", "0" ]
    origin_shift: [ "0", "0", "0" ]
  - rot_type: '1'
    sense: 0
    axis:
    - 0
    - 0
    screw_glide: [ "0", "0", "0" ]
    origin_shift: [ "0", "0", "0" ]
