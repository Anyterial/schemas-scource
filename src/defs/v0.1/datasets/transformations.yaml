$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/datasets/transformations
title: Transformations
$comment: Dataset of transformation entries.
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: transformations
  label: transformations_dataset
x-optimade-unit: inapplicable
type:
- array
- 'null'
description: |-
  Ordered table of crystallographic transformation records.
  Each item describes transformations and normalizer information for one concrete International Tables H-M entry.
  In `transformations_hm_entry.json.gz`, items are keyed for lookup by the companion top-level `indicies.index_hm_entry_to_transformations_per_hm_entry` object; that index is not an OPTIMADE property.

  **Requirements/Conventions**:

  - Items MUST be ordinary dictionaries rather than being keyed by H-M entry.
  - The `hm_entry` property identifies the International Tables H-M entry represented by the item.
  - The `hall_entry` property identifies the Hall setting used to generate setting-specific normalizer and transformation data.
items:
  x-optimade-type: dictionary
  x-optimade-unit: inapplicable
  type:
  - object
  - 'null'
  $$inherit: "/defs/v0.1/entrytypes/transformations"
examples:
- - hm_entry: P 1
    hall_entry: p_1
    centering_translations:
    - ['0', '0', '0']
    baernighausen: []
