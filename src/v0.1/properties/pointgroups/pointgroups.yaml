description: |-
  Point-group keyed map of crystallographic point-group records.

  Each key is a Hermann-Mauguin point-group symbol and each value contains the point-group classification, finite point-group operations, conjugacy classes, and real and complex character tables generated from cctbx and spgrep.

  **Requirements/Conventions**:

  - The map covers the 32 crystallographic point groups.
  - The point-group records are independent of any particular space-group setting.
  - Character-table rows use Mulliken labels and include formatted label variants when available.
