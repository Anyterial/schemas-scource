$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/v0.1/properties/spacegroups/spacegroups
title: Space groups
$comment: Anyterial top-level Hall-entry keyed space-group setting map.
x-optimade-type: dictionary
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: spacegroups
  label: spacegroups_spacegroups
x-optimade-unit: inapplicable
type:
- object
- 'null'
description: |-
  Hall-entry keyed map of crystallographic space-group setting records.
  Each key is the normalized Hall entry used by the data-generator tables, with underscores replacing spaces.
  Each value describes one concrete Hall/International Tables setting of a space group, including symbols, classifications, symmetry operations, asymmetric-unit information, Wyckoff positions, and related auxiliary data.

  **Requirements/Conventions**:

  - Keys are Hall-setting identifiers, not merely IT space-group numbers.
  - A single IT number can occur under several Hall keys.
  - Values are dictionaries for the specific setting represented by the key.
  - The `setting_it_nc` property gives the corresponding International Tables `n:c` setting code when applicable.
properties: {}
examples:
- c_2y:
    setting_it_nc: 5:b1
    it_number: 5
    hall_entry: c_2y
