$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/properties/spacegroups/transformations_per_hm_entry
title: Transformations per H-M entry
$comment: Anyterial property definition for H-M-entry grouped transformation records.
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: transformations_per_hm_entry
  label: transformations_per_hm_entry_spacegroups
x-optimade-unit: inapplicable
type:
- array
- 'null'
description: |-
  Transformation data grouped by H-M entry.
  Each list item contains the H-M entry as ordinary data together with all transformation sections generated for that setting.
  This representation avoids using H-M entries as JSON dictionary keys in the OPTIMADE-described payload.
  The accompanying `hall_entry` field identifies the Hall symbol used to compute the symmetry operations and normalizer data.

  **Requirements/Conventions**:

  - It MUST be a list of dictionaries.
  - Each dictionary MUST contain `hm_entry`.
  - Each dictionary SHOULD contain `hall_entry` and the generated transformation sections for that setting.
items:
  x-optimade-type: dictionary
  x-optimade-unit: inapplicable
  type:
  - object
  description: Transformation record for one H-M entry.
  required: [hm_entry]
  properties:
    hm_entry:
      $$inherit: "/defs/v0.1/properties/spacegroups/hm_entry"
    hall_entry:
      $$inherit: "/defs/v0.1/properties/spacegroups/hall_entry"
    euclidean_normalizer:
      $$inherit: "/defs/v0.1/properties/spacegroups/euclidean_normalizer"
    hall_to_it_std_transform:
      $$inherit: "/defs/v0.1/properties/spacegroups/hall_to_it_std_transform"
    orthogonal_affine_normalizer:
      $$inherit: "/defs/v0.1/properties/spacegroups/orthogonal_affine_normalizer"
    affine_normalizer:
      $$inherit: "/defs/v0.1/properties/spacegroups/affine_normalizer"
    continuous_normalizer:
      $$inherit: "/defs/v0.1/properties/spacegroups/continuous_normalizer"
    isomorphic_subgroups:
      $$inherit: "/defs/v0.1/properties/spacegroups/isomorphic_subgroups"
    baernighausen:
      $$inherit: "/defs/v0.1/properties/spacegroups/baernighausen"
examples:
- - hm_entry: P 1
    hall_entry: p_1
    baernighausen: []
