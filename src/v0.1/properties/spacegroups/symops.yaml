$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/v0.1/properties/spacegroups/symops
title: Symmetry operations
$comment: Anyterial symmetry property definition using the common reusable symop object definition.
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: symops
  label: symops_spacegroups
x-optimade-unit: inapplicable
type:
- array
- 'null'
description: |-
  Full list of symmetry operations for a space-group setting.
  Each list member is a `symop` object as defined by the shared Anyterial symmetry-operation definition.

  **Requirements/Conventions**:

  - It MUST be a list of dictionaries.
  - Each dictionary MUST follow the schema inherited from `/properties/symmetry/symop`.
  - For space-group operations, the `xyz` expression and optional screw/glide descriptors include the affine translational part of the operation.
items:
  $$inherit: "/properties/symmetry/symop"
examples:
- - rmat:
    - [1, 0, 0]
    - [0, 1, 0]
    - [0, 0, 1]
    xyz: x,y,z
    rot_type: '1'
    is_proper: true
    axis: [0, 0, 0]
    sense: 0
    screw_glide: ["0", "0", "0"]
    origin_shift: ["0", "0", "0"]
  - rmat:
    - [-1, 0, 0]
    - [0, -1, 0]
    - [0, 0, -1]
    xyz: -x,-y,-z
    rot_type: '-1'
    is_proper: false
    axis: [0, 0, 0]
    sense: 0
    screw_glide: ["0", "0", "0"]
    origin_shift: ["0", "0", "0"]
