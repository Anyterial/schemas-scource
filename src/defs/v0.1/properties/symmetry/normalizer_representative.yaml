$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/properties/symmetry/normalizer_representative
title: Normalizer representative
$comment: Reusable Anyterial definition for one listed Euclidean or affine normalizer representative.
x-optimade-type: dictionary
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: normalizer_representative
  label: normalizer_representative_symmetry
x-optimade-unit: inapplicable
type:
- object
- 'null'
description: |-
  One listed representative of a Euclidean or affine normalizer operation or coset.
  In affine-normalizer tables the representative is taken modulo the space group, so it should be read as one representative of an equivalence class rather than as the only operation in that class.
  Bounded affine-normalizer tables enumerate only the finite candidate set documented by the generator.

  **Requirements/Conventions**:

  - It MUST be a dictionary with the following keys:

      - **rmat**: OPTIONAL; Exact 3x3 matrix.
        Linear part when the representative is expressed as a same-setting affine operation.

      - **tvec**: OPTIONAL; List of 3 Fractions (String).
        Translation part when the representative is expressed as a same-setting affine operation.

      - **pmat**: OPTIONAL; Exact 3x3 matrix.
        Matrix part when the representative is expressed as a basis or setting transform.

      - **pvec**: OPTIONAL; List of 3 Fractions (String).
        Origin shift when the representative is expressed as a basis or setting transform.

      - **xyz**: OPTIONAL; String.
        Coordinate expression for display and debugging.

      - **compatible\_systems**: OPTIONAL; List of strings.
        Crystal metric systems for which a bounded affine candidate is compatible.

      - **operation\_kind**: OPTIONAL; String.
        Generator classification of the operation.

      - **normalizer\_kind**: OPTIONAL; String.
        Classification of the normalizer contribution.
properties:
  rmat:
    $$inherit: "/defs/v0.1/properties/symmetry/rmat"
  tvec:
    $$inherit: "/defs/v0.1/properties/symmetry/tvec"
  pmat:
    $$inherit: "/defs/v0.1/properties/symmetry/pmat"
  pvec:
    $$inherit: "/defs/v0.1/properties/symmetry/pvec"
  xyz:
    x-optimade-type: string
    x-optimade-unit: inapplicable
    type:
    - string
    - 'null'
    description: Coordinate expression for the representative in `x,y,z` notation.
  rmat_det:
    x-optimade-type: integer
    x-optimade-unit: inapplicable
    type:
    - integer
    - 'null'
    description: Determinant of the same-setting linear part, when supplied.
  rmat_is_orthogonal:
    x-optimade-type: boolean
    x-optimade-unit: inapplicable
    type:
    - boolean
    - 'null'
    description: Whether `rmat` is orthogonal, when supplied.
  pmat_is_orthogonal:
    x-optimade-type: boolean
    x-optimade-unit: inapplicable
    type:
    - boolean
    - 'null'
    description: Whether `pmat` is orthogonal, when supplied.
  compatible_systems:
    x-optimade-type: list
    x-optimade-unit: inapplicable
    type:
    - array
    - 'null'
    description: Crystal metric systems compatible with the candidate representative.
    items:
      x-optimade-type: string
      x-optimade-unit: inapplicable
      type:
      - string
      description: One compatible crystal-system label.
  operation_kind:
    x-optimade-type: string
    x-optimade-unit: inapplicable
    type:
    - string
    - 'null'
    description: Generator classification of the operation.
  normalizer_kind:
    x-optimade-type: string
    x-optimade-unit: inapplicable
    type:
    - string
    - 'null'
    description: Classification of the normalizer contribution.
examples:
- rmat:
  - ['-1', '0', '0']
  - ['0', '-1', '0']
  - ['0', '0', '1']
  tvec: ['0', '0', '0']
  xyz: -x,-y,z
  rmat_det: 1
  rmat_is_orthogonal: true
  compatible_systems: [monoclinic, orthorhombic]
