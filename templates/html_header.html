<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--theme-name:"twilight";--paper:\#f7f2e8;--ink:\#112b2e;--ink-soft:\#4f686c;--line:rgba(17,43,46,0.2);--accent:\#cf5a2f;--accent-rgb:207,90,47;--accent-soft:\#f1d9c7;--panel:\#f8f1e6;--surface:\#fffdfa;--surface-soft:\#faf4ea;--table-head:\#f6efe2;--bg-layer-a:\#edd6be;--bg-layer-b:\#d2e6e0;--bg-base-a:\#f7f1e6;--bg-base-b:\#ece2d1;--shadow:0 12px 26px rgba(17,43,46,0.1);}html[data-theme="dark"]{--theme-name:"dark";--paper:\#090a0b;--ink:\#e9edf5;--ink-soft:\#9ba9bc;--line:rgba(230,236,245,0.22);--accent:\#ff9b6d;--accent-rgb:255,155,109;--accent-soft:rgba(255,155,109,0.2);--panel:\#141821;--surface:\#16181c;--surface-soft:\#1a1f28;--table-head:\#16181c;--bg-layer-a:\#212736;--bg-layer-b:\#111724;--bg-base-a:\#06080d;--bg-base-b:\#0d1118;--shadow:0 12px 30px rgba(0,0,0,0.42);}html[data-theme="light"]{--theme-name:"light";--paper:\#ffffff;--ink:\#1c2a3a;--ink-soft:\#5c6b7f;--line:rgba(27,52,84,0.2);--accent:\#b44f28;--accent-rgb:180,79,40;--accent-soft:\#f8ddd2;--panel:\#f9fbff;--surface:\#ffffff;--surface-soft:\#f6f9ff;--table-head:\#f4f6fb;--bg-layer-a:\#e9f0ff;--bg-layer-b:\#e6f5ee;--bg-base-a:\#ffffff;--bg-base-b:\#f2f8ff;--shadow:0 12px 26px rgba(16,28,46,0.08);}html{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 4%, var(--bg-layer-a), transparent 52%),radial-gradient(circle at 88% 86%, var(--bg-layer-b), transparent 50%),linear-gradient(150deg, var(--bg-base-a), var(--bg-base-b) 72%);}body{max-width:1100px;margin:0 auto;padding:24px 24px 56px;font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);line-height:1.55;}h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;line-height:1.2;color:var(--ink);}h1{font-size:clamp(28px,4vw,42px);margin:0 0 0.6ex;}h2{font-size:clamp(22px,3vw,30px);margin:1.4em 0 0.5ex;border-bottom:1px solid var(--line);padding-bottom:6px;}h3{font-size:clamp(18px,2.2vw,24px);margin:1.2em 0 0.4ex;}a{color:var(--accent);text-decoration:none;}a:hover{text-decoration:underline;}code,pre,kbd,samp{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}code{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:0.92em;}pre{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;box-shadow:var(--shadow);}pre code{background:transparent;border:0;padding:0;}table{border-collapse:collapse;width:100%;margin:12px 0;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}th{background:var(--table-head);font-family:"Fraunces",Georgia,serif;font-weight:600;}tr:last-child td{border-bottom:0;}ul,ol{padding-left:24px;}hr{border:0;border-top:1px solid var(--line);margin:24px 0;}blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:4px 14px;color:var(--ink-soft);background:var(--surface);border-radius:0 8px 8px 0;}.anyterial-header{display:flex;align-items:center;gap:18px;padding:8px 0 18px;border-bottom:1px solid var(--line);margin:0 0 28px;}.anyterial-brand{display:flex;align-items:center;gap:14px;color:inherit;flex:1;}.anyterial-logo-link{display:block;line-height:0;}.anyterial-title a{color:inherit;text-decoration:none;}.anyterial-title a:hover{text-decoration:underline;}.anyterial-header img{width:clamp(56px,7vw,80px);height:auto;display:block;}.anyterial-header .anyterial-title{font-family:"Fraunces",Georgia,serif;font-size:clamp(20px,2.4vw,26px);font-weight:600;line-height:1.15;}.anyterial-header .anyterial-title small{display:block;font-family:"Instrument Sans",sans-serif;font-size:13px;font-weight:400;color:var(--ink-soft);margin-top:2px;letter-spacing:0.02em;}.theme-switch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px;background:var(--surface-soft);box-shadow:var(--shadow);}.theme-btn{border:1px solid transparent;border-radius:999px;background:transparent;color:var(--ink-soft);width:38px;height:38px;padding:0;display:inline-grid;place-content:center;cursor:pointer;transition:color 150ms ease, border-color 150ms ease, background 150ms ease;}.theme-btn:hover,.theme-btn:focus-visible{color:var(--ink);border-color:var(--line);outline:none;}.theme-btn.is-active{color:var(--ink);border-color:rgba(var(--accent-rgb),0.58);background:rgba(var(--accent-rgb),0.16);}.theme-icon{width:20px;height:20px;display:block;}</style><script>(function(){try{var t=window.localStorage.getItem("anyterial_theme");if(t!=="dark"&&t!=="twilight"&&t!=="light")t="twilight";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","twilight");}})();</script>
