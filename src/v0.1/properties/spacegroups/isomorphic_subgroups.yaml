properties: {}
examples:
- c_2y:
    items:
    - index: 1
      wyckoff_splitting:
        c:
        - - c
          - x,y,z
        b:
        - - b
          - 0,y,1/2
        a:
        - - a
          - 0,y,0
      pmat:
      - - '1'
        - '0'
      - - '0'
        - '1'
      pvec:
      - '0'
      - '0'
    - index: 2
      wyckoff_splitting:
        c:
        - - c
          - x,y,z
        - - c
          - x,y,z
        b:
        - - c
          - x,y,z
        a:
        - - a
          - 0,y,0
        - - b
          - 0,y,1/2
      pmat:
      - - '1'
        - '0'
      - - '0'
        - '1'
      pvec:
