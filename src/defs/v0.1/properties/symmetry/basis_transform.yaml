$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/properties/symmetry/basis_transform
title: Basis transformation
$comment: Reusable Anyterial definition for one crystallographic basis, setting, cell, or embedding transform.
x-optimade-type: dictionary
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: basis_transform
  label: basis_transform_symmetry
x-optimade-unit: inapplicable
type:
- object
- 'null'
description: |-
  One crystallographic transform between coordinate descriptions, settings, cells, or related group embeddings.
  The affine map itself is stored in the embedded `affine_transformation` field.
  Parent tables use this object for Hall-to-standard transforms, Bärnighausen subgroup transforms, isomorphic subgroup transforms, normalizer representatives, and same-space-group affine images.

  **Requirements/Conventions**:

  - It MUST be a dictionary with the following keys:

      - **affine\_transformation**: REQUIRED; Dictionary.
        Exact affine map for the transform.
        It MUST follow `/defs/v0.1/properties/symmetry/affine_transformation`.

      - **index**: OPTIONAL; Integer.
        Subgroup index, same-setting transform index, or cell-index metadata whose interpretation is defined by the parent table.

      - **subgroup\_type**: OPTIONAL; String.
        International Tables subgroup-type label when the transform describes a subgroup embedding.

      - **k\_subtype**: OPTIONAL; String or null.
        Klassengleiche subtype when the transform describes a klassengleiche subgroup relation.

      - **compatible\_systems**: OPTIONAL; List of strings.
        Crystal metric systems for which the transform is compatible.
        This is used for bounded affine normalizer representatives.

      - **operation\_kind**: OPTIONAL; String.
        Generator classification of the transform or representative.

      - **wyckoff\_splitting**: OPTIONAL; List.
        Wyckoff-position splitting metadata induced by the transform when available.

      - **criteria**: OPTIONAL; List.
        Backward-lift constraint metadata induced by the transform when available.
properties:
  affine_transformation:
    $$inherit: "/defs/v0.1/properties/symmetry/affine_transformation"
  index:
    x-optimade-type: integer
    x-optimade-unit: inapplicable
    type:
    - integer
    - 'null'
    description: Index metadata whose interpretation is supplied by the parent property.
  subgroup_type:
    x-optimade-type: string
    x-optimade-unit: inapplicable
    type:
    - string
    - 'null'
    description: International Tables subgroup-type label when applicable.
  k_subtype:
    x-optimade-type: string
    x-optimade-unit: inapplicable
    type:
    - string
    - 'null'
    description: Klassengleiche subtype when applicable.
  compatible_systems:
    x-optimade-type: list
    x-optimade-unit: inapplicable
    type:
    - array
    - 'null'
    description: Crystal metric systems compatible with the transform.
    items:
      x-optimade-type: string
      x-optimade-unit: inapplicable
      type:
      - string
      description: One compatible crystal-system label.
  operation_kind:
    x-optimade-type: string
    x-optimade-unit: inapplicable
    type:
    - string
    - 'null'
    description: Generator classification of the transform or representative.
  wyckoff_splitting:
    x-optimade-type: list
    x-optimade-unit: inapplicable
    type:
    - array
    - 'null'
    description: Wyckoff-position splitting metadata induced by the transform, grouped by explicit parent Wyckoff letter.
    items:
      x-optimade-type: dictionary
      x-optimade-unit: inapplicable
      type:
      - object
      description: Splitting data for one parent Wyckoff position.
      required: [parent, splits]
      properties:
        parent:
          x-optimade-type: string
          x-optimade-unit: inapplicable
          type:
          - string
          description: Parent Wyckoff letter.
        splits:
          x-optimade-type: list
          x-optimade-unit: inapplicable
          type:
          - array
          description: Ordered split records for this parent Wyckoff letter.
          items:
            x-optimade-type: dictionary
            x-optimade-unit: inapplicable
            type:
            - object
            description: One Wyckoff split record.
            required: [letter, xyz, affine]
            properties:
              letter:
                x-optimade-type: string
                x-optimade-unit: inapplicable
                type:
                - string
                description: Subgroup Wyckoff letter assigned by this split branch.
              xyz:
                x-optimade-type: string
                x-optimade-unit: inapplicable
                type:
                - string
                description: Coordinate expression for the split branch.
              affine:
                x-optimade-type: list
                x-optimade-unit: inapplicable
                type:
                - array
                description: Exact affine representation for the split branch.
                items:
                  x-optimade-type: list
                  x-optimade-unit: inapplicable
                  type:
                  - array
                  description: One affine row.
                  items:
                    $$inherit: "/defs/v0.1/properties/core/fraction"
  criteria:
    x-optimade-type: list
    x-optimade-unit: inapplicable
    type:
    - array
    - 'null'
    description: Backward-lift constraint metadata induced by the transform, grouped by explicit parent Wyckoff letter.
    items:
      x-optimade-type: dictionary
      x-optimade-unit: inapplicable
      type:
      - object
      description: Backward-lift constraints for one parent Wyckoff position.
      required: [parent, constraints]
      properties:
        parent:
          x-optimade-type: string
          x-optimade-unit: inapplicable
          type:
          - string
          description: Parent Wyckoff letter.
        constraints:
          x-optimade-type: list
          x-optimade-unit: inapplicable
          type:
          - array
          description: Constraint records for this parent Wyckoff letter.
          items:
            x-optimade-type: dictionary
            x-optimade-unit: inapplicable
            type:
            - object
            description: One linear backward-lift constraint record.
            properties:
              roles:
                x-optimade-type: list
                x-optimade-unit: inapplicable
                type:
                - array
                description: Wyckoff-position role references entering the constraint.
                items:
                  x-optimade-type: dictionary
                  x-optimade-unit: inapplicable
                  type:
                  - object
                  description: One role reference.
                  required: [letter, index]
                  properties:
                    letter:
                      x-optimade-type: string
                      x-optimade-unit: inapplicable
                      type:
                      - string
                      description: Wyckoff letter for the referenced role.
                    index:
                      x-optimade-type: integer
                      x-optimade-unit: inapplicable
                      type:
                      - integer
                      description: Zero-based occurrence index for the role.
              coeffs:
                x-optimade-type: list
                x-optimade-unit: inapplicable
                type:
                - array
                description: Exact coefficient vectors for the constraint.
                items:
                  x-optimade-type: list
                  x-optimade-unit: inapplicable
                  type:
                  - array
                  description: Coefficients associated with one role.
                  items:
                    x-optimade-type: list
                    x-optimade-unit: inapplicable
                    type:
                    - array
                    description: One exact coefficient vector.
                    items:
                      $$inherit: "/defs/v0.1/properties/core/fraction"
              target:
                x-optimade-type: list
                x-optimade-unit: inapplicable
                type:
                - array
                description: Exact target vector or scalar for the constraint.
                items:
                  $$inherit: "/defs/v0.1/properties/core/fraction"
examples:
- affine_transformation:
    matrix:
    - ['1', '0', '0']
    - ['0', '1', '0']
    - ['0', '0', '2']
    vector: ['0', '0', '0']
  index: 2
