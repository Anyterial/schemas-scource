  name: items
  label: items_symmetry
type:
- array
- 'null'
description: |-
  List of records in a compact generated table.

  This property is used for tables whose natural top-level representation is an ordered list rather than a map. In symbol tables it contains one record per generated Hall or International Tables setting. In transform tables it contains one record per transform candidate or transform entry.

  **Requirements/Conventions**:

  - The interpretation of each item is determined by the dataset and by the fields present in the item.
  - Ordering is deterministic and produced by the corresponding generator.
x-optimade-unit: inapplicable
items:
