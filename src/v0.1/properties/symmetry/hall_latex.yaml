title: Hall symbol LaTeX rendering
$comment: Generated from data-generators JSON-LD fields without external definition URLs.
x-optimade-type: string
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: hall_latex
  label: hall_latex_symmetry
type:
- string
- 'null'
description: |-
  LaTeX rendering of the Hall symbol for the setting.

  This field contains a display-oriented LaTeX expression generated from the Hall-table symbol. Overlines, subscripts, superscripts, and prime marks are encoded so that the expression can be rendered by a LaTeX or MathJax-like renderer.

  **Requirements/Conventions**:

  - The mathematical content MUST match the ASCII Hall symbol in `hall`.
  - Typography follows the International Tables style where practical, including roman lattice letters and roman subscript letters.
x-optimade-unit: inapplicable
examples:
- \mathrm{P} 1
- \overline{\mathrm{P}} 1
