- 'null'
description: |-
  Detailed metadata for generated subgroup relations.

  For maximal non-isomorphic subgroup tables, this map contains one record per generated relation. Each record identifies the subgroup, the subgroup index, and the International Tables subgroup class information.

  **Requirements/Conventions**:

  - `index` is the subgroup index.
  - `subgroup_type` distinguishes translationengleiche (`t`) and klassengleiche (`k`) maximal subgroups.
  - `k_subtype` further classifies klassengleiche subgroups when applicable.
x-optimade-unit: inapplicable
properties: {}
examples:
- '5':
  - it_number: 1
    index: 2
    subgroup_type: t
    k_subtype: null
  - it_number: 3
    index: 2
    subgroup_type: k
    k_subtype: loss_of_centering_translation
