description: |-
  Hall-entry keyed map of crystallographic space-group setting records.

  Each key is the normalized Hall entry used by the data-generator tables, with underscores replacing spaces. Each value describes one concrete Hall/International Tables setting of a space group, including symbols, classifications, symmetry operations, asymmetric-unit information, Wyckoff positions, and related auxiliary data.

  **Requirements/Conventions**:

  - Keys are Hall-setting identifiers, not merely IT space-group numbers; a single IT number can occur under several Hall keys.
  - Values are records for the specific setting represented by the key.
  - The `setting_it_nc` property gives the corresponding International Tables `n:c` setting code when applicable.
