$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/properties/spacegroups/symops
title: Symmetry operations
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: symops
  label: symops_spacegroups
x-optimade-unit: inapplicable
type:
- array
- 'null'
description: |-
  Full list of symmetry-operation descriptors for a space-group setting.
  
  Each list member is an operation on the format defined by the property definition: https://schemas.anyterial.se/defs/v0.1/properties/symmetry/op
items:
  $$inherit: "/defs/v0.1/properties/symmetry/op"
examples:
- - affine_transformation:
      matrix:
      - ['1', '0', '0']
      - ['0', '1', '0']
      - ['0', '0', '1']
      vector: ['0', '0', '0']
      xyz: x,y,z
    rot_type: '1'
    sense: 0
    axis: [0, 0, 0]
    screw_glide: ['0', '0', '0']
    origin_shift: ['0', '0', '0']
