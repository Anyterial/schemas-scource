$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/v0.1/properties/spacegroups/affine_normalizer_cosets
title: Affine Normalizer Cosets
$comment: Generated from data-generators JSON-LD fields without external definition URLs.
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: affine_normalizer_cosets
  label: affine_normalizer_cosets_spacegroups
type:
- array
- 'null'
description: |-
  Runtime table of bounded affine normalizer coset representatives modulo the space group, generated from small unimodular integer linear parts.

  Each item is one coset representative; the list is finite and bounded by the generator choices documented in the data-generators README.
x-optimade-unit: inapplicable
items:
  x-optimade-type: dictionary
  type:
  - object
  - 'null'
  description: One normalizer coset representative or normalizer operation.
  properties:
    pmat: &id001
      x-optimade-type: list
      type:
      - array
      - 'null'
      description: Three rows of a 3 by 3 matrix with exact rational/algebraic entries.
      items:
        x-optimade-type: list
        type:
        - array
        - 'null'
        description: One matrix row.
        items:
          x-optimade-type: string
          type:
          - string
          - 'null'
          description: One matrix entry.
          x-optimade-unit: inapplicable
        x-optimade-unit: inapplicable
      x-optimade-unit: inapplicable
    pvec: &id002
      x-optimade-type: list
      type:
      - array
      - 'null'
      description: Three fractional-coordinate components written as exact rational/algebraic strings.
      items:
        x-optimade-type: string
        type:
        - string
        - 'null'
        description: One exact coordinate component.
        x-optimade-unit: inapplicable
      x-optimade-unit: inapplicable
    rmat: *id001
    tvec: *id002
    rmat_det:
      x-optimade-type: integer
      type:
      - integer
      - 'null'
      description: Determinant of the linear operation matrix.
      x-optimade-unit: inapplicable
    rmat_is_orthogonal:
      x-optimade-type: boolean
      type:
      - boolean
      - 'null'
      description: Whether the linear operation is orthogonal.
      x-optimade-unit: inapplicable
    pmat_is_orthogonal:
      x-optimade-type: boolean
      type:
      - boolean
      - 'null'
      description: Whether the basis-transformation matrix is orthogonal.
      x-optimade-unit: inapplicable
    P_det:
      x-optimade-type: integer
      type:
      - integer
      - 'null'
      description: Determinant of the legacy P matrix representation, where present.
      x-optimade-unit: inapplicable
    compatible_systems:
      x-optimade-type: list
      type:
      - array
      - 'null'
      description: Crystal metric systems compatible with this affine candidate.
      items:
        x-optimade-type: string
        type:
        - string
        - 'null'
        description: One compatible crystal-system label.
        x-optimade-unit: inapplicable
      x-optimade-unit: inapplicable
    operation_kind:
      x-optimade-type: string
      type:
      - string
      - 'null'
      description: Generator classification for the operation.
      x-optimade-unit: inapplicable
    normalizer_kind:
      x-optimade-type: string
      type:
      - string
      - 'null'
      description: Classification of the normalizer contribution.
      x-optimade-unit: inapplicable
  x-optimade-unit: inapplicable
examples:
- - rmat:
    - - '-1'
      - '1'
    - - '-1'
      - '0'
    tvec:
    - '0'
    - '0'
    xyz: -x+y,-x,-z
    rmat_det: -1
    rmat_is_orthogonal: false
    compatible_systems:
    - trigonal
    - hexagonal
  - rmat:
    - - '-1'
      - '1'
    - - '-1'
      - '0'
    tvec:
    - '0'
    - '0'
    xyz: -x+y,-x,z
    rmat_det: 1
    rmat_is_orthogonal: false
    compatible_systems:
    - trigonal
    - hexagonal
  - rmat:
    - - '-1'
      - '1'
    - - '0'
      - '1'
    tvec:
    - '0'
    - '0'
    xyz: -x+y,y,-z
    rmat_det: 1
    rmat_is_orthogonal: false
    compatible_systems:
    - trigonal
    - hexagonal
- - rmat:
    - - '-1'
      - '0'
    - - '0'
      - '-1'
    tvec:
    - '0'
    - '0'
    xyz: -x,-y,-z
    rmat_det: -1
    rmat_is_orthogonal: true
    compatible_systems:
    - triclinic
    - monoclinic
  - rmat:
    - - '-1'
      - '0'
    - - '0'
      - '-1'
    tvec:
    - '0'
    - '0'
    xyz: -x,-y,z
    rmat_det: 1
    rmat_is_orthogonal: true
    compatible_systems:
    - monoclinic
    - orthorhombic
  - rmat:
    - - '-1'
      - '0'
    - - '0'
      - '1'
    tvec:
    - '0'
    - '0'
    xyz: -x,y,z
    rmat_det: -1
    rmat_is_orthogonal: true
    compatible_systems:
    - monoclinic
    - orthorhombic
