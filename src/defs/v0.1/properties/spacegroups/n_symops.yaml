$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/properties/spacegroups/n_symops
title: Number of symops
x-optimade-type: integer
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: n_symops
  label: n_symops_spacegroups
type:
- integer
- 'null'
description: |-
  Number of symmetry operations in the finite operation list of the generated entry.

  When the entry contains a `symops` list, this value MUST equal its length.
x-optimade-unit: inapplicable
examples:
- 1
- 2
