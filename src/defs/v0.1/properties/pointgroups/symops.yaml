$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/properties/pointgroups/symops
title: Symmetry operations
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: symops
  label: symops_pointgroups
x-optimade-unit: inapplicable
type:
- array
- 'null'
description: |-
  Full list of symmetry-operation descriptors for a point group.
  Each list member is an `op` object as defined by `/defs/v0.1/properties/symmetry/op`.
  Point-group operations have a zero translation part, so the `screw_glide` and `origin_shift` classification fields are omitted.

  **Requirements/Conventions**:

  - It MUST be a list of dictionaries.
  - Each dictionary MUST follow the schema inherited from `/defs/v0.1/properties/symmetry/op`.
items:
  $$inherit: "/defs/v0.1/properties/symmetry/op"
examples:
- - affine_transformation:
      matrix:
      - ['1', '0', '0']
      - ['0', '1', '0']
      - ['0', '0', '1']
      vector: ['0', '0', '0']
      xyz: x,y,z
      det: 1
      is_orthogonal: true
    rot_type: '1'
    sense: 0
    axis: [0, 0, 0]
