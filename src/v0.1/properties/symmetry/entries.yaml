title: Entries
$comment: Generated from data-generators JSON-LD fields without external definition URLs.
x-optimade-type: dictionary
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: entries
  label: entries_symmetry
type:
- object
- 'null'
description: |-
  Compact adjacency or lookup entries for a generated relation table.

  In maximal-subgroup relation data, this map gives the subgroup IT numbers associated with each supergroup IT number. More detailed information about each relation is stored separately in `relation_details`.

  **Requirements/Conventions**:

  - Keys are serialized identifiers used by the containing table.
  - Values are compact lists or maps intended for efficient lookup.
  - When detailed relation metadata is needed, clients SHOULD use the corresponding detail table if present.
x-optimade-unit: inapplicable
properties: {}
examples:
- c_2y:
    p_2y:
    - index: 2
      P:
      - - '1'
        - '0'
      - - '0'
        - '1'
      p:
      - '0'
      - '0'
      wyckoff_splitting:
        c:
        - - e
          - x,y,z
        - - e
          - x,y,z
        b:
        - - b
          - 0,y,1/2
        - - d
          - 1/2,y,1/2
        a:
        - - a
          - 0,y,0
        - - c
          - 1/2,y,0
    - index: 4
      P:
      - - '1'
        - '0'
      - - '0'
        - '2'
      p:
      - '0'
      - '0'
      wyckoff_splitting:
