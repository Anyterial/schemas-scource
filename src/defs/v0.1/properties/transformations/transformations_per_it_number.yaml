$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/properties/transformations/transformations_per_it_number
title: Transformations per IT number
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: transformations_per_it_number
  label: transformations_per_it_number_transformations
x-optimade-unit: inapplicable
type:
- array
- 'null'
description: |-
  Standard-setting transformation data grouped by International Tables space-group number.
  
  Each list item contains the IT number as ordinary data together with all standard-setting transformation sections generated for that space-group type.
  This representation avoids using IT numbers as JSON dictionary keys in the OPTIMADE-described payload.

  **Requirements/Conventions**:

  - It MUST be a list of dictionaries.
  - Each dictionary MUST contain `it_number`.
  - Each dictionary SHOULD contain the generated standard-setting transformation sections for that IT number.
items:
  x-optimade-type: dictionary
  x-optimade-unit: inapplicable
  type:
  - object
  description: Transformation record for one International Tables number.
  required: [it_number]
  properties:
    it_number:
      $$inherit: "/defs/v0.1/properties/spacegroups/it_number"
    baernighausen:
      $$inherit: "/defs/v0.1/properties/transformations/baernighausen"
    backward_lift_criteria:
      $$inherit: "/defs/v0.1/properties/transformations/backward_lift_criteria"
    isomorphic_subgroups:
      $$inherit: "/defs/v0.1/properties/transformations/isomorphic_subgroups"
    same_space_group_affine_images_std:
      $$inherit: "/defs/v0.1/properties/transformations/same_space_group_affine_images_std"
    continuous_normalizer:
      $$inherit: "/defs/v0.1/properties/transformations/continuous_normalizer"
    orthogonal_affine_normalizer:
      $$inherit: "/defs/v0.1/properties/transformations/orthogonal_affine_normalizer"
    affine_normalizer:
      $$inherit: "/defs/v0.1/properties/transformations/affine_normalizer"
examples:
- - it_number: 1
    baernighausen: []
