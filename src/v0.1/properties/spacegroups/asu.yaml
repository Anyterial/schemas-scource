$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/v0.1/properties/spacegroups/asu
title: Asu
$comment: Generated from data-generators JSON-LD fields without external definition URLs.
x-optimade-type: dictionary
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: asu
  label: asu_spacegroups
type:
- object
- 'null'
description: |-
  Structured asymmetric-unit description for the space-group setting.

  The asymmetric unit is represented as a list of half-space cuts and logical cut expressions in fractional coordinates. Together these cuts define a representative region of the unit cell from which the full space group can generate all equivalent positions.

  **Requirements/Conventions**:

  - `cuts` contains the complete serialized cut tree.
  - `shape_only_cuts` contains only the geometric shape restrictions, omitting some conditional refinements.
  - The formatted `asu_*` fields provide compact textual renderings of the same information.
x-optimade-unit: inapplicable
properties:
  cuts:
    x-optimade-type: list
    type:
    - array
    - 'null'
    description: Complete serialized asymmetric-unit cut tree.
    items:
      $$inherit: /properties/spacegroups/asu_cut
    x-optimade-unit: inapplicable
  shape_only_cuts:
    x-optimade-type: list
    type:
    - array
    - 'null'
    description: Geometric cut tree with conditional refinements omitted.
    items:
      $$inherit: /properties/spacegroups/asu_cut
    x-optimade-unit: inapplicable
examples:
- cuts:
  - kind: cut
    ascii: x0
    xyz: x>=0
    inclusive: true
    base_symbol: x0
    normal:
    - '1'
    - '0'
    const: '0'
    condition: null
  - kind: cut
    ascii: +x1
    xyz: x<1
    inclusive: false
    base_symbol: x1
    normal:
    - '-1'
    - '0'
    const: '1'
    condition: null
  shape_only_cuts:
  - kind: cut
    ascii: x0
    xyz: x>=0
    inclusive: true
    base_symbol: x0
    normal:
    - '1'
    - '0'
    const: '0'
    condition: null
  - kind: cut
    ascii: x1
    xyz: x<=1
    inclusive: true
    base_symbol: x1
    normal:
    - '-1'
    - '0'
    const: '1'
    condition: null
- cuts:
  - kind: cut
    ascii: x0(y0(z2) & y2(z2))
    xyz: x>=0 [y>=0 [z<=1/2] & y<=1/2 [z<=1/2]]
    inclusive: true
    base_symbol: x0
    normal:
    - '1'
    - '0'
    const: '0'
    condition:
      kind: expr
      ascii: y0(z2) & y2(z2)
      xyz: y>=0 [z<=1/2] & y<=1/2 [z<=1/2]
      op: '&'
      lhs:
        kind: cut
        ascii: y0(z2)
        xyz: y>=0 [z<=1/2]
        inclusive: true
        base_symbol: y0
        normal:
        - '0'
        - '1'
        const: '0'
        condition:
          kind: cut
          ascii: z2
      rhs:
        kind: cut
        ascii: y2(z2)
        xyz: y<=1/2 [z<=1/2]
        inclusive: true
        base_symbol: y2
        normal:
        - '0'
        - '-1'
        const: 1/2
        condition:
          kind: cut
          ascii: z2
  - kind: cut
    ascii: x2(y0(z2) & y2(z2))
    xyz: x<=1/2 [y>=0 [z<=1/2] & y<=1/2 [z<=1/2]]
    inclusive: true
    base_symbol: x2
    normal:
    - '-1'
    - '0'
    const: 1/2
    condition:
      kind: expr
      ascii: y0(z2) & y2(z2)
      xyz: y>=0 [z<=1/2] & y<=1/2 [z<=1/2]
      op: '&'
      lhs:
        kind: cut
        ascii: y0(z2)
        xyz: y>=0 [z<=1/2]
        inclusive: true
        base_symbol: y0
        normal:
        - '0'
        - '1'
        const: '0'
        condition:
          kind: cut
          ascii: z2
      rhs:
        kind: cut
        ascii: y2(z2)
        xyz: y<=1/2 [z<=1/2]
        inclusive: true
        base_symbol: y2
        normal:
        - '0'
        - '-1'
        const: 1/2
        condition:
          kind: cut
          ascii: z2
  shape_only_cuts:
  - kind: cut
    ascii: x0
    xyz: x>=0
    inclusive: true
    base_symbol: x0
    normal:
    - '1'
    - '0'
    const: '0'
    condition: null
  - kind: cut
    ascii: x2
    xyz: x<=1/2
    inclusive: true
    base_symbol: x2
    normal:
    - '-1'
    - '0'
    const: 1/2
    condition: null
