$$schema: https://schemas.optimade.org/meta/v1.3/optimade/property_definition
$id: https://schemas.anyterial.se/defs/v0.1/properties/symmetry/wyckoff_position
title: Wyckoff position
x-optimade-type: dictionary
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: wyckoff_position
  label: wyckoff_position_symmetry
x-optimade-unit: inapplicable
type:
- object
- 'null'
description: |-
  Information related to a Wyckoff position in a space-group setting.

  Wyckoff positions represent symmetry-equivalent sites partitioned by multiplicity and site symmetry in a given space group.
  The property is a dictionary containing information about the multiplicity, oriented site-symmetry symbol, representative coordinate, full orbit, and orbit factorized modulo centering translations.

  **Requirements/Conventions**:

  - It MUST be a dictionary with the following keys:

      - **letter**: REQUIRED; String.
        Wyckoff letter for this position in the setting.

      - **multiplicity**: REQUIRED; Integer.
        Multiplicity of the Wyckoff position in the conventional cell.
        It MUST equal the length of `orbit`.

      - **sitesym**: REQUIRED; String.
        Oriented site-symmetry symbol.

      - **hasfreedom**: REQUIRED; List of booleans.
        Flags indicating whether each fractional coordinate has a free parameter.

      - **first\_orbit**: REQUIRED; String.
        First representative coordinate expression used by the generator.
        It MUST equal the `xyz` field of `orbit[0]`.

      - **orbit**: REQUIRED; List.
        Full orbit as a list of affine transformations from Wyckoff-position parameters to fractional coordinates.
        The first item is the canonical representative whose degrees of freedom can be chosen to place it inside the asymmetric unit.

      - **orbit\_mod\_centering**: REQUIRED; List.
        Orbit representatives modulo centering translations, represented in the same form as `orbit`.
properties:
  letter:
    $$inherit: "/defs/v1.3/properties/optimade/structures/wyckoff_positions"
  multiplicity:
    x-optimade-type: integer
    x-optimade-unit: inapplicable
    x-compatible:
      - "https://www.iucr.org/__data/iucr/cifdic_html/3/CORE_DIC/Ispace_group_Wyckoff.multiplicity.html"
    type:
    - integer
    - 'null'
    description: Multiplicity of the Wyckoff position in the conventional cell.
  sitesym:
    x-optimade-type: string
    x-optimade-unit: inapplicable
    x-compatible:
      - "https://www.iucr.org/__data/iucr/cifdic_html/3/CORE_DIC/Ispace_group_Wyckoff.site_symmetry.html"
    type:
    - string
    - 'null'
    description: |-
      The site-symmetry symbol for the subgroup of the space group that leaves the point fixed.
      The symmetry direction is determined by the Hermann-Mauguin symbol of the space group, as given in International Tables for Crystallography Volume A, Section 2.2.12 (2006).
  hasfreedom:
    x-optimade-type: list
    x-optimade-unit: inapplicable
    x-optimade-dimensions:
      names: ["dim_lattice"]
      sizes: [3]
    type:
    - array
    - 'null'
    description: A list of three booleans indicating whether each fractional coordinate contains a free parameter.
    items:
      x-optimade-type: boolean
      x-optimade-unit: inapplicable
      type:
      - boolean
      description: A boolean indicating if the corresponding coordinate is free.
  first_orbit_ita:
    x-optimade-type: string
    x-optimade-unit: inapplicable
    type:
    - string
    - 'null'
    description: Representative coordinate expression following the source convention in the International Tables of Crystallography Volume A (2006), when distinct from `first_orbit`.
  first_orbit:
    x-optimade-type: string
    x-optimade-unit: inapplicable
    type:
    - string
    - 'null'
    description: |-
      Representative coordinate expression for the Wyckoff position chosen such that the degrees of freedom can be chosen to place it inside the asymmetric unit obtained from cctbx.
      This value MUST equal the `xyz` field of `orbit[0]`; it is repeated here as a directly queryable convenience field.
  orbit:
    x-optimade-type: list
    x-optimade-unit: inapplicable
    type:
    - array
    - 'null'
    description: |-
      Full orbit of the Wyckoff position.
      Each item is an affine transformation from the Wyckoff-position parameter vector `(x, y, z)` to one fractional coordinate in the orbit.
      The matrix part may be singular because special Wyckoff positions can constrain or identify parameters.
    items:
      $$inherit: "/defs/v0.1/properties/symmetry/affine_transformation"
  orbit_mod_centering:
    x-optimade-type: list
    x-optimade-unit: inapplicable
    type:
    - array
    - 'null'
    description: |-
      Representatives of the Wyckoff-position orbit modulo centering translations.
      Each item has the same affine-transformation representation as an item in `orbit`.
    items:
      $$inherit: "/defs/v0.1/properties/symmetry/affine_transformation"
examples:
- letter: e
  multiplicity: 2
  sitesym: '1'
  hasfreedom: [true, true, true]
  first_orbit: x,y,z
  orbit:
  - matrix:
    - ['1', '0', '0']
    - ['0', '1', '0']
    - ['0', '0', '1']
    vector: ['0', '0', '0']
    xyz: x,y,z
  - matrix:
    - ['-1', '0', '0']
    - ['0', '1', '0']
    - ['0', '0', '-1']
    vector: ['0', '0', '0']
    xyz: -x,y,-z
  orbit_mod_centering:
  - matrix:
    - ['1', '0', '0']
    - ['0', '1', '0']
    - ['0', '0', '1']
    vector: ['0', '0', '0']
    xyz: x,y,z
  - matrix:
    - ['-1', '0', '0']
    - ['0', '1', '0']
    - ['0', '0', '-1']
    vector: ['0', '0', '0']
    xyz: -x,y,-z
