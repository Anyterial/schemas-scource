  format: '1.3'
  name: wyckoff
  label: wyckoff_pointgroups
type:
- object
- 'null'
description: |-
  Wyckoff-position table for a specific space-group setting.

  Each key is a Wyckoff letter and each value describes one Wyckoff position, including multiplicity, oriented site-symmetry symbol, representative coordinate, and the full orbit generated by the space group.

  **Requirements/Conventions**:

  - `orbit_affine` and `orbit_xyz` contain the full orbit.
  - `orbit_mod_centering_affine` and `orbit_mod_centering_xyz` contain one representative modulo centering translations.
  - `centering_translations` expands the modulo-centering orbit back to the full orbit.
x-optimade-unit: inapplicable
properties: {}
examples:
- a:
    multiplicity: 1
- i:
    multiplicity: 2
