$$schema: https://schemas.optimade.org/meta/v1.2/optimade/property_definition
$id: https://schemas.anyterial.se/v0.1/properties/symmetry/asu_cut
title: Asymmetric-Unit Cut
$comment: Reusable Anyterial source definition for one serialized asymmetric-unit cut expression.
x-optimade-type: dictionary
x-optimade-definition:
  kind: property
  version: 0.1.0
  format: '1.3'
  name: asu_cut
  label: asu_cut_symmetry
type:
- object
- 'null'
description: One serialized asymmetric-unit cut or logical cut expression.
x-optimade-unit: inapplicable
properties:
  kind:
    x-optimade-type: string
    type:
    - string
    - 'null'
    description: Kind of cut expression, such as a half-space cut or logical combination.
    x-optimade-unit: inapplicable
  ascii:
    x-optimade-type: string
    type:
    - string
    - 'null'
    description: ASCII rendering of the cut expression.
    x-optimade-unit: inapplicable
  xyz:
    x-optimade-type: string
    type:
    - string
    - 'null'
    description: Coordinate expression for the cut in x,y,z notation.
    x-optimade-unit: inapplicable
  inclusive:
    x-optimade-type: boolean
    type:
    - boolean
    - 'null'
    description: Whether the cut boundary is included in this part of the asymmetric unit.
    x-optimade-unit: inapplicable
  base_symbol:
    x-optimade-type: string
    type:
    - string
    - 'null'
    description: Base symbolic inequality or coordinate label used for the cut.
    x-optimade-unit: inapplicable
  normal:
    x-optimade-type: list
    type:
    - array
    - 'null'
    description: Normal vector of a half-space cut, with exact components.
    items:
      x-optimade-type: string
      type:
      - string
      - 'null'
      description: One exact normal-vector component.
      x-optimade-unit: inapplicable
    x-optimade-unit: inapplicable
  const:
    x-optimade-type: string
    type:
    - string
    - 'null'
    description: Right-hand-side constant of a half-space cut, represented exactly.
    x-optimade-unit: inapplicable
  op:
    x-optimade-type: string
    type:
    - string
    - 'null'
    description: Logical operator used when the cut expression combines two subexpressions.
    x-optimade-unit: inapplicable
  lhs:
    x-optimade-type: dictionary
    type:
    - object
    - 'null'
    description: Left-hand operand for a logical cut expression.
    x-optimade-unit: inapplicable
    properties: {}
  rhs:
    x-optimade-type: dictionary
    type:
    - object
    - 'null'
    description: Right-hand operand for a logical cut expression.
    x-optimade-unit: inapplicable
    properties: {}
  condition:
    x-optimade-type: dictionary
    type:
    - object
    - 'null'
    description: Optional conditional cut expression that refines when this cut applies.
    x-optimade-unit: inapplicable
    properties: {}
examples:
- kind: cut
  ascii: x0
  xyz: x>=0
  inclusive: true
  base_symbol: x0
  normal:
  - '1'
  - '0'
  const: '0'
  condition: null
- kind: expr
  ascii: x0 & y0
  xyz: x>=0 & y>=0
  op: '&'
  lhs:
    kind: cut
    ascii: x0
    xyz: x>=0
  rhs:
    kind: cut
    ascii: y0
    xyz: y>=0
